name: e-paperHUB Server Bridge

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: exec | exec_enc | enc_tar | sync_env | pull | deploy"
        required: true
        default: "exec"
      cmd:
        description: "Command (for mode=exec) or AES-256 encrypted payload (for mode=exec_enc / sync_env)"
        required: false
        default: "ls -la /root/epaper-hub"
      remote_dir:
        description: "Remote project directory on 45.76.198.7"
        required: false
        default: "/root/epaper-hub"
      bridge_key:
        description: "AES-256 decryption key"
        required: true

permissions:
  contents: write

jobs:
  server-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass and rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Decrypt SSH credentials
        env:
          BKEY: ${{ inputs.bridge_key }}
        run: |
          set +x
          echo "::add-mask::$BKEY"
          PASS=$(cat .github/auth.enc | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -base64 -A -pass "pass:$BKEY")
          echo "::add-mask::$PASS"
          echo "SERVER_PASS_RESOLVED=$PASS" >> "$GITHUB_ENV"

      - name: Execute remote command (mode = exec)
        if: inputs.mode == 'exec'
        env:
          SSHPASS: ${{ env.SERVER_PASS_RESOLVED }}
          BKEY: ${{ inputs.bridge_key }}
          REMOTE_CMD: ${{ inputs.cmd }}
        run: |
          set +x
          sshpass -e ssh -o StrictHostKeyChecking=no root@45.76.198.7 "$REMOTE_CMD"

      - name: Execute encrypted command (mode = exec_enc)
        if: inputs.mode == 'exec_enc'
        env:
          SSHPASS: ${{ env.SERVER_PASS_RESOLVED }}
          BKEY: ${{ inputs.bridge_key }}
          ENC_PAYLOAD: ${{ inputs.cmd }}
        run: |
          set +x
          DEC_CMD=$(echo "$ENC_PAYLOAD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -base64 -A -pass "pass:$BKEY")
          echo "===BEGIN_ENC_OUT==="
          sshpass -e ssh -o StrictHostKeyChecking=no root@45.76.198.7 "$DEC_CMD" 2>&1 \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -base64 -pass "pass:$BKEY"
          echo "===END_ENC_OUT==="

      - name: Sync encrypted .env to Tokyo server (mode = sync_env)
        if: inputs.mode == 'sync_env'
        env:
          SSHPASS: ${{ env.SERVER_PASS_RESOLVED }}
          BKEY: ${{ inputs.bridge_key }}
          ENC_ENV: ${{ inputs.cmd }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          set +x
          echo "$ENC_ENV" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -base64 -A -pass "pass:$BKEY" > /tmp/.env.decrypted
          chmod 600 /tmp/.env.decrypted
          sshpass -e scp -o StrictHostKeyChecking=no /tmp/.env.decrypted "root@45.76.198.7:${REMOTE_DIR}/.env"
          rm -f /tmp/.env.decrypted
          echo "Encrypted .env synced to ${REMOTE_DIR}/.env on Tokyo server."

      - name: Fetch encrypted project archive (mode = enc_tar)
        if: inputs.mode == 'enc_tar'
        env:
          SSHPASS: ${{ env.SERVER_PASS_RESOLVED }}
          BKEY: ${{ inputs.bridge_key }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          set +x
          echo "===BEGIN_ENC_TAR==="
          sshpass -e ssh -o StrictHostKeyChecking=no root@45.76.198.7 \
            "tar -czf - -C '${REMOTE_DIR}' --exclude='.git' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='node_modules' --exclude='static/uploads' --exclude='static/processed' --exclude='static/fotos' ." \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -base64 -pass "pass:$BKEY"
          echo "===END_ENC_TAR==="

      - name: Pull e-paperHUB project from server to GitHub repo (mode = pull)
        if: inputs.mode == 'pull'
        env:
          SSHPASS: ${{ env.SERVER_PASS_RESOLVED }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          set +x
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.env*' \
            --exclude='esp32_firmware/secrets.h' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='xiaomi_session.json' \
            --exclude='google_cal_config.json' \
            --exclude='gcal_config.json' \
            --exclude='tuya_device_assignments.json' \
            --exclude='static/uploads/*' \
            --exclude='static/processed/*' \
            --exclude='static/fotos/*' \
            --exclude='static/screen.bin' \
            --exclude='static/screen_preview.png' \
            --exclude='logs/*' \
            -e "ssh -o StrictHostKeyChecking=no" \
            "root@45.76.198.7:${REMOTE_DIR}/" ./
          git config user.name "servermcp"
          git config user.email "45525254+servermcp@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync clean e-paperHUB code from server"
            git push origin HEAD:main
          else
            echo "No changes to commit from server."
          fi

      - name: Deploy repo changes to server (mode = deploy)
        if: inputs.mode == 'deploy'
        env:
          SSHPASS: ${{ env.SERVER_PASS_RESOLVED }}
          INPUT_REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          set +x
          TARGET_DIR="${INPUT_REMOTE_DIR:-/root/epaper-hub}"
          echo "Deploying clean code to root@45.76.198.7:${TARGET_DIR} ..."
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.env*' \
            --exclude='esp32_firmware/secrets.h' \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.db' \
            --exclude='*.sqlite*' \
            --exclude='xiaomi_session.json' \
            --exclude='google_cal_config.json' \
            --exclude='gcal_config.json' \
            --exclude='tuya_device_assignments.json' \
            --exclude='static/uploads/*' \
            --exclude='static/processed/*' \
            --exclude='static/fotos/*' \
            --exclude='static/screen.bin' \
            --exclude='static/screen_preview.png' \
            --exclude='logs/*' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "root@45.76.198.7:${TARGET_DIR}/"
          sshpass -e ssh -o StrictHostKeyChecking=no root@45.76.198.7 "systemctl restart epaper-hub.service && systemctl status epaper-hub.service --no-pager | head -n 15"
